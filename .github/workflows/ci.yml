name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 语法编译检查
        run: python -m compileall -q app main.py

      - name: 严重错误检查（阻塞合并）
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .

      - name: 代码规范（存量告警期，暂不阻塞）
        continue-on-error: true
        run: ruff check --output-format=github .

  frontend:
    name: 前端 · Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build

  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查敏感文件是否被纳入版本控制
        run: |
          set -euo pipefail
          hit=$(git ls-files | grep -E '(^|/)\.env$|(^|/)data/.*\.(db|sqlite3?)$|(^|/)\.secret_key$' || true)
          if [ -n "$hit" ]; then
            echo "::error::以下敏感文件已被 git 跟踪，请立即移除并吊销相关凭据：$hit"
            exit 1
          fi
          echo "未发现被跟踪的敏感文件"
